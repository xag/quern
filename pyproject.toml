[project]
name = "quern"
version = "0.1.5"
description = "A tree whose semantics — vocabulary, rules and solvers — are data, authored at runtime and published as digest-pinned packages through a proof gate"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Xavier Grehant" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fluent-syntax>=0.19",
    "pydantic>=2",
    "wasmtime>=25",  # sandboxed solver runtime: fuel-metered, no ambient authority
    # The boundary (src/quern/boundary.py) is declared and recorded from every CLI run: the
    # registry, the lockfile, blob bytes, $QUERN_REGISTRY. A runtime dependency, not a dev
    # one — recording that only happens in development is recording that is absent from
    # every run a user could report.
    # Distribution name; the module is `flight_recorder`. The floor is the PyPI release
    # the suite was run against (293 tests, 2026-11-08): 0.11.1 is the rev pinned under
    # [tool.uv.sources], which development resolves and a built wheel does not carry. Below it
    # a trace is not masked by the boundary's redact and scrub, so the floor moves with the pin.
    "xag-flight-recorder>=0.11.1",
]

[project.urls]
Homepage = "https://github.com/xag/quern"
Repository = "https://github.com/xag/quern"
Issues = "https://github.com/xag/quern/issues"

[project.optional-dependencies]
# quern.host registers the tree_* MCP tools over a Workspace; only a server needs it.
# (The geometry extra is gone with the geometry module: shapes are a domain package now,
# and a shape-carrying host installs that package instead.)
# Both majors, through `quern._mcp`: 1.x has `mcp.server.fastmcp.FastMCP`, 2.x has
# `mcp.server.mcpserver.MCPServer`, and every difference between them goes through that
# one module. A server that also imports a 2.x-only library needs 2.x; a consumer whose
# own code is on 1.x (invest, home, spec-studio, the navigator) keeps 1.x. CAPPED BELOW 3,
# and the cap is load-bearing: an uncapped `mcp` once broke korean-gpt-coach's production
# (2026-08-12) and this repo's first CI run (2026-08-13), because a local venv holding the
# old major passes forever while a fresh resolve does not. Lift it by teaching
# `quern._mcp` the next major and running the suite on it, never by widening the range.
host = ["mcp[cli]>=1.2,<3"]

[project.scripts]
quern = "quern.cli:main"

[tool.uv.sources]
# Pinned by rev, always — the estate's fork-or-republish doctrine over resolver algebra.
xag-flight-recorder = { git = "https://github.com/xag/flight-recorder", rev = "4d24784d9e6b7da1cb8c741984b0261fe096b9e7" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quern"]

[tool.hatch.build.targets.sdist]
# The package and what describes it. The ledger, the tests (which import the ledger), the
# claims file and the flight tapes are the repository's, not the distribution's.
only-include = ["src/quern", "README.md", "LICENSE", "pyproject.toml"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# `ledger/` is quern's own design ledger — a design-time artifact at the repo root, kept out
# of the shipped package (packages = ["src/quern"]). It is not installed, so put the root on
# the path or the suite cannot see it.
pythonpath = ["."]
